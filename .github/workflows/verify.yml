name: Verify

# Verifies the public portfolio site on every push and pull request.
# This workflow does NOT publish or deploy anything — deployment is
# handled separately by Cloudflare Pages' own GitHub integration.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Astro type/content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Internal link + private-URL check
        run: npm run check:links

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests + accessibility scan
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
