name: Verify

# Verifies the public portfolio site on every push and pull request.
# This workflow does NOT publish or deploy anything — deployment is
# handled separately by Cloudflare Pages' own GitHub integration.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Astro type/content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Internal link + private-URL check
        run: npm run check:links
